[package]
name = "termblit"
version = "0.1.0"
edition = "2024"
description = "Stream RGBA frames to the terminal with Kitty graphics, Sixel or colored characters"
license = "Apache-2.0"
repository = "https://github.com/Murat65536/termblit"
readme = "README.md"
keywords = ["terminal", "kitty", "sixel", "graphics", "tui"]
categories = ["command-line-interface", "graphics"]

[dependencies]
ansi_colours = { version = "1.2.3", default-features = false }
base64 = "0.23.1"
crossterm = "0.29.0"
flate2 = "1.1.10"
profiling = "1.0.18"

# Shared memory for Kitty graphics
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["event", "mm", "shm", "stdio"] }

[dev-dependencies]
vt100 = "0.18.1"
